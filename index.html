<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Primary Meta Tags -->
        <title>TechNews - Notícias de tecnologia</title>
        <meta name="title" content="TechNews - Notícias de tecnologia" />
        <meta
            name="description"
            content="Agregador de notícias de tecnologia do Hacker News, TabNews, Dev.to, Lobsters e Twitter. Fique por dentro das últimas novidades em programação, desenvolvimento web e tecnologia."
        />
        <meta
            name="keywords"
            content="tecnologia, programação, desenvolvimento, hacker news, tabnews, dev.to, notícias tech, agregador de notícias, web development, software engineering"
        />
        <meta name="author" content="TechNews" />
        <meta name="robots" content="index, follow" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://technews.example.com/" />
        <meta property="og:title" content="TechNews - Notícias de tecnologia" />
        <meta
            property="og:description"
            content="Agregador de notícias de tecnologia do Hacker News, TabNews, Dev.to, Lobsters e Twitter. Fique por dentro das últimas novidades em programação, desenvolvimento web e tecnologia."
        />
        <meta
            property="og:image"
            content="https://technews.example.com/og-image.png"
        />
        <meta property="og:locale" content="pt_BR" />
        <meta property="og:site_name" content="TechNews" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:url" content="https://technews.example.com/" />
        <meta
            name="twitter:title"
            content="TechNews - Notícias de tecnologia"
        />
        <meta
            name="twitter:description"
            content="Agregador de notícias de tecnologia do Hacker News, TabNews, Dev.to, Lobsters e Twitter. Fique por dentro das últimas novidades em programação, desenvolvimento web e tecnologia."
        />
        <meta
            name="twitter:image"
            content="https://technews.example.com/og-image.png"
        />

        <!-- Canonical URL -->
        <link rel="canonical" href="https://technews.example.com/" />

        <!-- Additional SEO -->
        <meta name="theme-color" content="#0f172a" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />

        <!-- JSON-LD Structured Data -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebSite",
                "name": "TechNews",
                "description": "Agregador de notícias de tecnologia do Hacker News, TabNews, Dev.to, Lobsters e Twitter. Fique por dentro das últimas novidades em programação, desenvolvimento web e tecnologia.",
                "url": "https://technews.example.com",
                "potentialAction": {
                    "@type": "SearchAction",
                    "target": {
                        "@type": "EntryPoint",
                        "urlTemplate": "https://technews.example.com?q={search_term_string}"
                    },
                    "query-input": "required name=search_term_string"
                },
                "publisher": {
                    "@type": "Organization",
                    "name": "TechNews",
                    "url": "https://technews.example.com"
                }
            }
        </script>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <script>
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Inter", "sans-serif"],
                        },
                        colors: {
                            tabnews: "#2474e0",
                            hackernews: "#ff6600",
                            dark: {
                                900: "#0f172a",
                                800: "#1e293b",
                                700: "#334155",
                            },
                        },
                    },
                },
            };
        </script>
        <style>
            /* Light theme variables */
            :root {
                --bg-primary: #ffffff;
                --bg-secondary: #f8fafc;
                --text-primary: #0f172a;
                --text-secondary: #64748b;
                --border-color: #e2e8f0;
            }

            /* Dark theme variables */
            .dark {
                --bg-primary: #0f172a;
                --bg-secondary: #1e293b;
                --text-primary: #e2e8f0;
                --text-secondary: #94a3b8;
                --border-color: #334155;
            }

            body {
                background-color: var(--bg-primary);
                color: var(--text-primary);
                font-family: "Inter", sans-serif;
                transition:
                    background-color 0.2s ease,
                    color 0.2s ease;
            }

            /* Custom scrollbar for webkit */
            ::-webkit-scrollbar {
                width: 8px;
            }
            ::-webkit-scrollbar-track {
                background: var(--bg-primary);
            }
            ::-webkit-scrollbar-thumb {
                background: var(--border-color);
                border-radius: 4px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: var(--text-secondary);
            }

            /* Markdown Reader Styles */
            .markdown-body {
                font-size: 1.125rem; /* 18px text */
                line-height: 1.8;
            }
            .markdown-body p {
                margin-bottom: 1.25rem;
            }
            .markdown-body h1,
            .markdown-body h2,
            .markdown-body h3 {
                font-weight: 700;
                margin-top: 2rem;
                margin-bottom: 1rem;
                color: var(--text-primary);
                line-height: 1.3;
            }
            .markdown-body h1 {
                font-size: 2rem;
            }
            .markdown-body h2 {
                font-size: 1.75rem;
            }
            .markdown-body h3 {
                font-size: 1.5rem;
            }

            .markdown-body pre {
                background: var(--bg-secondary);
                padding: 1.25rem;
                border-radius: 0.75rem;
                overflow-x: auto;
                margin-bottom: 1.5rem;
                font-size: 0.95rem;
                border: 1px solid var(--border-color);
            }
            .markdown-body a {
                color: #60a5fa;
                text-decoration: underline;
                text-underline-offset: 4px;
            }
            .markdown-body ul {
                list-style-type: disc;
                padding-left: 1.5rem;
                margin-bottom: 1.25rem;
            }
            .markdown-body li {
                margin-bottom: 0.5rem;
            }
            .markdown-body blockquote {
                border-left: 4px solid var(--border-color);
                padding-left: 1rem;
                color: var(--text-secondary);
                font-style: italic;
                margin-bottom: 1.25rem;
            }

            /* Bottom sheet slide-up animation */
            @keyframes slide-up {
                from {
                    transform: translateY(100%);
                }
                to {
                    transform: translateY(0);
                }
            }
            .animate-slide-up {
                animation: slide-up 0.3s ease-out;
            }

            /* Shimmer animation for loading states */
            @keyframes shimmer {
                0% {
                    background-position: -468px 0;
                }
                100% {
                    background-position: 468px 0;
                }
            }

            .shimmer {
                animation: shimmer 2s infinite linear;
                background: linear-gradient(
                    to right,
                    transparent 0%,
                    rgba(255, 255, 255, 0.05) 50%,
                    transparent 100%
                );
                background-size: 468px 100%;
            }

            /* Light theme shimmer */
            :root:not(.dark) .shimmer {
                background: linear-gradient(
                    to right,
                    transparent 0%,
                    rgba(0, 0, 0, 0.04) 50%,
                    transparent 100%
                );
            }

            /* Reduced motion support */
            @media (prefers-reduced-motion: reduce) {
                .shimmer {
                    animation: none;
                    background: none;
                }
            }

            /* Keyboard badge animations */
            @keyframes badge-pop {
                0% {
                    transform: scale(0) rotate(-12deg);
                    opacity: 0;
                }
                60% {
                    transform: scale(1.15) rotate(3deg);
                }
                100% {
                    transform: scale(1) rotate(0deg);
                    opacity: 1;
                }
            }

            @keyframes badge-pulse {
                0%,
                100% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(1.05);
                }
            }

            @keyframes badge-fade {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 0.3;
                }
            }

            .animate-badge-pop {
                animation: badge-pop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            }

            .animate-badge-pulse {
                animation: badge-pulse 1.5s ease-in-out infinite;
            }

            .animate-badge-fade {
                animation: badge-fade 0.2s ease-out;
            }

            /* Disable badge animations on reduced motion */
            @media (prefers-reduced-motion: reduce) {
                .animate-badge-pop,
                .animate-badge-pulse,
                .animate-badge-fade {
                    animation: none;
                }
            }
        </style>
        <script type="importmap">
            {
                "imports": {
                    "react/": "https://esm.sh/react@^19.2.1/",
                    "react": "https://esm.sh/react@^19.2.1",
                    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
                    "lucide-react": "https://esm.sh/lucide-react@^0.560.0",
                    "react-dom/": "https://esm.sh/react-dom@^19.2.1/"
                }
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/index.tsx"></script>
    </body>
</html>
